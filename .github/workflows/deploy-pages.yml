name: Deploy to GitHub Pages

# 推送到 main 或手动触发时，构建静态站点并发布到 GitHub Pages。
# 发布看板同样会产生一次 commit，因此内容更新后会自动重新部署。

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 安装依赖
        run: pnpm install --frozen-lockfile

      - uses: actions/configure-pages@v5

      - name: 构建静态站点
        run: pnpm build
        env:
          # GitHub Pages 部署在 /<repo>/ 子路径下，必须设置前缀，
          # 否则 public/ 下的内容路径与 /_next 资源都会 404
          NEXT_PUBLIC_BASE_PATH: /board-hub
          NEXT_PUBLIC_SITE_URL: https://kael-odin.github.io/board-hub
          SITE_URL: https://kael-odin.github.io/board-hub

          # 内容仓库信息。仓库名和分支没有敏感信息，直接写死；
          # App ID 与加密密钥从仓库 Secrets 读取（Settings → Secrets and variables → Actions）
          NEXT_PUBLIC_GITHUB_OWNER: kael-odin
          NEXT_PUBLIC_GITHUB_REPO: board-hub
          NEXT_PUBLIC_GITHUB_BRANCH: main
          NEXT_PUBLIC_GITHUB_APP_ID: ${{ secrets.NEXT_PUBLIC_GITHUB_APP_ID }}
          NEXT_PUBLIC_GITHUB_ENCRYPT_KEY: ${{ secrets.NEXT_PUBLIC_GITHUB_ENCRYPT_KEY }}

      - name: 确认导出产物存在
        run: |
          if [ ! -d out ]; then
            echo "::error::没有生成 out/ 目录，检查 next.config.ts 的 output: 'export'"
            exit 1
          fi
          echo "导出文件数: $(find out -type f | wc -l)"

      - uses: actions/upload-pages-artifact@v3
        with:
          path: out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
